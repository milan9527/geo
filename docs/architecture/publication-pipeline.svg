<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#56697A"/></marker></defs>
<rect x="0" y="0" width="1440" height="760" rx="0" fill="#F4F7F9" stroke="#F4F7F9" stroke-width="1.5"/>
<text fill="#152A36" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="48" y="64.0">Review before every new publication</tspan></text>
<text fill="#56697A" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="48" y="106.0">Scheduled runs and manual reviews share the same publication safeguards</tspan></text>
