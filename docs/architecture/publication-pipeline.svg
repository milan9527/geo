<text fill="#56697A" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="1198" y="274.25">Recheck versions</tspan><tspan x="1198" y="298.0">Database guards</tspan></text>
<rect x="48" y="490" width="600" height="150" rx="12" fill="#FFFFFF" stroke="#D9E2E8" stroke-width="1.5"/>
<rect x="48" y="506" width="5" height="118" rx="0" fill="#B74444" stroke="#B74444" stroke-width="1.5"/>
<text fill="#152A36" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="68" y="530.0">Keep under review</tspan></text>
<text fill="#56697A" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="68" y="563.0">Insufficient evidence, duplicate content, uncertain results,</tspan><tspan x="68" y="586.75">failed translation, or changed inputs block publication.</tspan></text>
<polyline points="605,350 605,410 347,410 347,490" fill="none" stroke="#56697A" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="831,350 831,435 430,435 430,490" fill="none" stroke="#56697A" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1057,350 1057,460 510,460 510,490" fill="none" stroke="#56697A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="780" y="490" width="608" height="150" rx="12" fill="#FFFFFF" stroke="#D9E2E8" stroke-width="1.5"/>
<rect x="780" y="506" width="5" height="118" rx="0" fill="#0E9384" stroke="#0E9384" stroke-width="1.5"/>
<text fill="#152A36" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="800" y="530.0">Publish both editions</tspan></text>
<text fill="#56697A" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="800" y="563.0">English: /article/{slug}     Chinese: /zh/article/{slug}</tspan><tspan x="800" y="586.75">Refresh discovery files and notify IndexNow.</tspan></text>
<polyline points="1283,350 1283,490" fill="none" stroke="#56697A" stroke-width="2" marker-end="url(#arrow)"/>
<text fill="#56697A" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="48" y="709.0">Existing published URLs remain protected. New content cannot replace or unpublish an older page.</tspan></text>
</svg>
