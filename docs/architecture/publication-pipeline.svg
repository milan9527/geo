<text fill="#56697A" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="972" y="274.25">Full translation</tspan><tspan x="972" y="298.0">Separate review</tspan></text>
<polyline points="1162,278 1178,278" fill="none" stroke="#56697A" stroke-width="2" marker-end="url(#arrow)"/>
