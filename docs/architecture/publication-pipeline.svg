<text fill="#56697A" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="520" y="274.25">Facts + citations</tspan><tspan x="520" y="298.0">Independent audit</tspan></text>
<polyline points="710,278 726,278" fill="none" stroke="#56697A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="726" y="205" width="210" height="145" rx="12" fill="#FFFFFF" stroke="#D9E2E8" stroke-width="1.5"/>
<rect x="726" y="221" width="5" height="113" rx="0" fill="#0E9384" stroke="#0E9384" stroke-width="1.5"/>
<text fill="#152A36" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="746" y="242.0">04  Deduplicate</tspan></text>
<text fill="#56697A" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="746" y="274.25">Full public corpus</tspan><tspan x="746" y="298.0">Core overlap</tspan></text>
