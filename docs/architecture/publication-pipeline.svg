<text fill="#152A36" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="294" y="242.0">02  Draft</tspan></text>
<text fill="#56697A" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="294" y="274.25">Generate research</tspan><tspan x="294" y="298.0">Revise as needed</tspan></text>
<polyline points="484,278 500,278" fill="none" stroke="#56697A" stroke-width="2" marker-end="url(#arrow)"/>
