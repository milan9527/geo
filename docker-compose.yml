services:
  postgres:
    image: postgres:16-alpine
    container_name: aperture-geo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo_dev_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - geo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  geo_postgres_data:
